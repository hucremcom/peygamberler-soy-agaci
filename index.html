<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7a1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Şecere-i Peygamberî — İnteraktif Soy Ağacı</title>
<style>
  :root{
    --maroon:#7a1330; --maroon-dark:#4a0b1d; --gold:#c9a15a; --cream:#f6efe0;
    --card:#ffffff; --card-border:#d8c9a8; --line:#8a8578; --text:#2a2420;
    --muted:#6b645a; --prophet-bg:#7a1330; --prophet-text:#fff;
    --ring:#c9a15a; --bg:#efe6d0; --panel:#fffaf0; --shadow:rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1712; --panel:#241d16; --card:#2b2219; --card-border:#4a3d2c;
      --text:#eee3cf; --muted:#b8ac95; --line:#8a7a5c; --cream:#2b2219; }
  }
  :root[data-theme="dark"]{ --bg:#1c1712; --panel:#241d16; --card:#2b2219; --card-border:#4a3d2c;
      --text:#eee3cf; --muted:#b8ac95; --line:#8a7a5c; --cream:#2b2219; }
  :root[data-theme="light"]{ --bg:#efe6d0; --panel:#fffaf0; --card:#ffffff; --card-border:#d8c9a8;
      --text:#2a2420; --muted:#6b645a; --line:#8a8578; --cream:#f6efe0; }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden; overscroll-behavior:none; touch-action:none;}

  header{
    position:relative; z-index:20;
    background:linear-gradient(135deg,var(--maroon-dark),var(--maroon) 55%,#8f1c3c);
    color:#fdf3df; padding:10px 14px; display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 10px var(--shadow); flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.3px; white-space:nowrap;}
  header h1 small{display:block; font-weight:400; font-size:10px; opacity:.8;}
  .spacer{flex:1;}
  .toolbar{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .searchbox{position:relative;}
  .searchbox input{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35); color:#fff;
    border-radius:20px; padding:7px 12px 7px 30px; font-size:13px; width:150px; outline:none;
    transition:width .2s;
  }
  .searchbox input::placeholder{color:rgba(255,255,255,.65);}
  .searchbox input:focus{width:210px; background:rgba(255,255,255,.2);}
  .searchbox svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.75; pointer-events:none;}
  #searchResults{
    position:absolute; top:36px; left:0; width:260px; max-height:280px; overflow:auto;
    background:var(--panel); color:var(--text); border:1px solid var(--card-border); border-radius:10px;
    box-shadow:0 8px 24px var(--shadow); display:none; z-index:50;
  }
  #searchResults div{padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--card-border);}
  #searchResults div:last-child{border-bottom:none;}
  #searchResults div:hover{background:var(--maroon); color:#fff;}
  #searchResults .none{color:var(--muted); cursor:default;}
  #searchResults .none:hover{background:none; color:var(--muted);}

  button.btn{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff;
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px;
    white-space:nowrap;
  }
  button.btn:hover{background:rgba(255,255,255,.28);}
  button.btn.active{background:var(--gold); color:#3a2b0e; border-color:var(--gold); font-weight:700;}
  .iconbtn{width:30px; height:30px; padding:0; justify-content:center; font-size:15px; font-weight:700;}

  #stage{position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; touch-action:none; cursor:grab;
    user-select:none; -webkit-user-select:none; -moz-user-select:none;}
  #stage *{ -webkit-user-drag:none; user-drag:none; }
  #stage.grabbing{cursor:grabbing;}
  #canvas{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; padding:60px 80px 140px 80px;}

  ul.tree, ul.tree ul{
    list-style:none; margin:0; padding:0; display:flex; padding-top:34px; position:relative;
  }
  ul.tree.root{padding-top:0;}
  ul.tree li{
    position:relative; display:flex; flex-direction:column; align-items:center;
    padding:34px 14px 0 14px; text-align:center;
  }
  ul.tree.root > li{padding-top:0;}
  /* connector lines are drawn with a real SVG overlay (#linesSvg) computed from
     actual rendered box positions — see drawConnectors() — rather than CSS
     pseudo-element math, which proved fragile across nested flex widths. */
  #linesSvg{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}
  #linesSvg path.connector{stroke:var(--line); stroke-width:2.4px; fill:none;}
  #linesSvg path.connector.dashed{stroke:var(--gold); stroke-width:2.4px; stroke-dasharray:7 6;}

  .nodewrap{position:relative; display:inline-flex; flex-direction:column; align-items:center;}
  .node{
    background:var(--card); border:2px solid var(--card-border); border-radius:10px;
    padding:7px 12px; min-width:96px; cursor:pointer; box-shadow:0 2px 6px var(--shadow);
    transition:transform .12s, box-shadow .12s, border-color .12s;
    position:relative; user-select:none;
  }
  .node:hover{transform:translateY(-2px); box-shadow:0 6px 14px var(--shadow); border-color:var(--gold);}
  .node.prophet{background:var(--prophet-bg); color:var(--prophet-text); border-color:#efc873;}
  .node.rasul{background:linear-gradient(135deg,#8a1a1a,#c9a15a); border-color:#ffe9b0;}
  .node .name{font-size:13px; font-weight:700; line-height:1.25;}
  .node .title{font-size:10px; opacity:.85; font-weight:400; margin-top:1px;}
  .node.highlight{outline:3px solid #2fb8a6; outline-offset:2px; animation:pulse 1.4s ease-in-out 2;}
  @keyframes pulse{0%,100%{outline-color:#2fb8a6;}50%{outline-color:#ffd25a;}}

  .toggle{
    position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%; background:var(--gold); color:#3a2b0e;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
    border:2px solid var(--panel); cursor:pointer; z-index:5; box-shadow:0 2px 4px var(--shadow);
  }
  .childcount{
    position:absolute; top:-8px; right:-8px; background:var(--maroon); color:#fff; font-size:9px;
    border-radius:8px; padding:1px 5px; font-weight:700; display:none;
  }
  li.collapsed > ul{display:none;}
  li.collapsed > .nodewrap .childcount{display:inline-block;}

  /* legend */
  #legend{
    position:absolute; left:12px; bottom:12px; z-index:15; background:var(--panel);
    border:1px solid var(--card-border); border-radius:10px; padding:10px 14px; font-size:11.5px;
    box-shadow:0 4px 16px var(--shadow); max-width:230px; color:var(--text);
  }
  #legend h4{margin:0 0 6px 0; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);}
  #legend .row{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  #legend .swatch{width:16px; height:16px; border-radius:4px; flex:none; border:2px solid var(--card-border);}
  #legend .line{width:20px; height:0; border-top:2px solid var(--line); flex:none;}
  #legend .line.dashed{border-top:2px dashed var(--gold);}
  #legend button{margin-top:4px; font-size:10.5px; background:none; border:none; color:var(--muted); cursor:pointer; text-decoration:underline; padding:0;}

  /* zoom controls */
  #zoomctl{position:absolute; right:12px; bottom:12px; z-index:15; display:flex; flex-direction:column; gap:6px;}
  #zoomctl button{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--card-border); background:var(--panel);
    color:var(--text); font-size:18px; font-weight:700; cursor:pointer; box-shadow:0 3px 10px var(--shadow);
  }
  #zoomctl button:active{transform:scale(.94);}

  /* modal */
  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  #modal{
    background:var(--panel); color:var(--text); max-width:420px; width:100%; border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); overflow:hidden; border:1px solid var(--card-border);
    max-height:85vh; display:flex; flex-direction:column;
  }
  #modalHead{background:linear-gradient(135deg,var(--maroon-dark),var(--maroon)); color:#fdf3df; padding:16px 18px; position:relative;}
  #modalHead .name{font-size:19px; font-weight:800;}
  #modalHead .title{font-size:12px; opacity:.85; margin-top:2px;}
  #modalClose{position:absolute; top:10px; right:12px; background:rgba(255,255,255,.15); border:none; color:#fff;
    width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:14px;}
  #modalBody{padding:16px 18px; overflow:auto; font-size:14px; line-height:1.55;}
  #modalBody .badge{display:inline-block; font-size:10.5px; background:var(--gold); color:#3a2b0e; padding:2px 8px; border-radius:10px; font-weight:700; margin-bottom:8px;}
  #modalBody .lineage{font-size:11.5px; color:var(--muted); margin-top:12px; padding-top:10px; border-top:1px dashed var(--card-border);}

  #hint{
    position:absolute; top:56px; left:50%; transform:translateX(-50%); z-index:14;
    background:var(--panel); border:1px solid var(--card-border); color:var(--muted); font-size:11.5px;
    padding:6px 12px; border-radius:20px; box-shadow:0 4px 12px var(--shadow); opacity:.95;
    pointer-events:none; transition:opacity .4s;
  }
  select#langSel{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:8px; padding:5px 6px; font-size:12px;}
  select#langSel option{color:#000;}

  @media (max-width:640px){
    header h1{font-size:12.5px;}
    .searchbox input{width:110px;}
    .searchbox input:focus{width:150px;}
    #legend{max-width:160px; font-size:10px; padding:8px 10px;}
    #hint{display:none;}
  }
</style>
</head>
<body>

<header>
  <h1 id="mainTitle">Şecere-i Muhammedî <small id="subTitle">Peygamberler Soy Ağacı — İnteraktif</small></h1>
  <div class="spacer"></div>
  <div class="toolbar">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="İsim ara…">
      <div id="searchResults"></div>
    </div>
    <button class="btn" id="expandAllBtn">⊕ <span>Tümünü Aç</span></button>
    <button class="btn" id="collapseAllBtn">⊖ <span>Tümünü Kapat</span></button>
    <select id="langSel">
      <option value="tr">TR</option>
      <option value="en">EN</option>
    </select>
    <button class="btn iconbtn" id="themeBtn" title="Tema">◐</button>
  </div>
</header>

<div id="stage">
  <div id="canvas"></div>
</div>

<div id="hint">🖱️ Sürükle • Tekerlek: yakınlaştır • Kutuya tıkla: detay • ⊕/⊖: dalları aç/kapat</div>

<div id="legend">
  <h4 id="legendTitle">Gösterge</h4>
  <div class="row"><span class="swatch" style="background:var(--prophet-bg)"></span><span id="lg1">Peygamber (Kur'an'da adı geçen)</span></div>
  <div class="row"><span class="swatch" style="background:var(--card)"></span><span id="lg2">Ata / Aile üyesi</span></div>
  <div class="row"><span class="line"></span><span id="lg3">Doğrudan soy</span></div>
  <div class="row"><span class="line dashed"></span><span id="lg4">Nesil atlama / dolaylı bağ</span></div>
  <button id="legendHide">Gizle</button>
</div>

<div id="zoomctl">
  <button id="zoomIn">+</button>
  <button id="zoomReset" style="font-size:11px;" title="Tümünü sığdır">⟳</button>
  <button id="zoomOut">−</button>
</div>

<div id="overlay">
  <div id="modal">
    <div id="modalHead">
      <button id="modalClose">✕</button>
      <div class="name" id="modalName"></div>
      <div class="title" id="modalTitleTxt"></div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================
   DATA MODEL — JSON tabanlı soy ağacı (Peygamberler Şeceresi)
   Kaynak: "Family Tree of the Prophets" (EN) + "Şecere-i Muhammedî,
   Peygamberler Soyu" (TR) posterlerinin sentezi.
   Her düğüm: { id, tr:{name,title,note}, en:{name,title,note},
                prophet:bool, rasul:bool, dashed:bool, children:[...] }
   dashed:true  → üst düğüme "nesil atlama / dolaylı" bağ ile bağlanır
   ============================================================ */

function n(id, tr, en, opts, children){
  opts = opts || {};
  return {
    id: id,
    tr: {name: tr[0]||'', title: tr[1]||'', note: tr[2]||''},
    en: {name: en[0]||'', title: en[1]||'', note: en[2]||''},
    prophet: !!opts.prophet,
    rasul: !!opts.rasul,
    dashed: !!opts.dashed,
    children: children || []
  };
}

            n('idris', ['İdris','Aleyhisselâm','Kur\'an\'da adı geçen peygamberlerden. Rivayete göre yazıyı, terziliği ve astronomiyi ilk öğretenlerdendir; kendisine sahifeler indirilmiştir.'],
                       ['Idris (Enoch)','Peace be upon him','A prophet mentioned in the Qur\'an; tradition credits him with teaching writing, tailoring and astronomy. Scrolls were revealed to him.'],

                       ['Noah','Peace be upon him','One of the most-mentioned prophets in the Qur\'an and one of the five "Ulu\'l-Azm" (greatest-resolve) prophets. He called his people to monotheism for 950 years; the Great Flood occurred in his time and his ark saved the believers.'],
                       {prophet:true, rasul:true}, [

                    n('sam', ['Sâm','','Nuh\'un oğlu. Gelenekte Arapların, Farslıların ve İbranilerin atası kabul edilir.'],

                                                    ['Abraham','Peace be upon him — "Khalilullah" (Friend of God)','One of the five Ulu\'l-Azm prophets; rebuilt the Kaaba together with his son Ishmael. Regarded as the common patriarch of the Muslim, Jewish and Christian traditions. His wives Hagar and Sarah gave rise to two great prophetic lines: Ishmael and Isaac.'],

/* ============================================================
   STATE
   ============================================================ */
let lang = 'tr';
let theme = null; // follow system by default
let scale = 0.62, panX = 0, panY = 0;
const collapsedIds = new Set(); // ids currently collapsed
const nodeIndex = {}; // id -> data node

function indexNodes(node){
  nodeIndex[node.id] = node;
  (node.children||[]).forEach(indexNodes);
}
indexNodes(DATA);
EXTRA.forEach(e=>nodeIndex[e.id]=e);

/* default collapse: keep the huge Adnan->Muhammad chain and Yakup's 12 sons open,
   but collapse the very long single-child ancestor chains to reduce visual noise */
const DEFAULT_COLLAPSED = ['ismail12','diger12'];
DEFAULT_COLLAPSED.forEach(id=>collapsedIds.add(id));

/* ============================================================
   RENDER
   ============================================================ */
const canvas = document.getElementById('canvas');

function label(node, field){
  const d = node[lang] || node.tr;
  return d[field] || '';
}

function buildNodeEl(node, isRoot){
  const li = document.createElement('li');
  const hasChildren = node.children && node.children.length;
  if(hasChildren && collapsedIds.has(node.id)) li.classList.add('collapsed');
  if(node.dashed) li.classList.add('dashedlink');

  const wrap = document.createElement('div');
  wrap.className = 'nodewrap';

  const box = document.createElement('div');
  box.className = 'node' + (node.prophet ? ' prophet' : '') + (node.rasul ? ' rasul' : '');
  box.dataset.id = node.id;

  const nm = document.createElement('div');
  nm.className = 'name';
  nm.textContent = label(node,'name');
  box.appendChild(nm);

  const tt = label(node,'title');
  if(tt){
    const ti = document.createElement('div');
    ti.className = 'title';
    ti.textContent = tt;
    box.appendChild(ti);
  }

  box.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(node); });
  wrap.appendChild(box);

  if(hasChildren){
    const cc = document.createElement('span');
    cc.className = 'childcount';
    cc.textContent = node.children.length;
    wrap.appendChild(cc);

    const tg = document.createElement('div');
    tg.className = 'toggle';
    tg.textContent = collapsedIds.has(node.id) ? '+' : '−';
    tg.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(collapsedIds.has(node.id)){ collapsedIds.delete(node.id); } else { collapsedIds.add(node.id); }
      renderTreeKeepingAnchor(node.id);
    });
    wrap.appendChild(tg);
  }

  li.appendChild(wrap);

  if(hasChildren){
    const ul = document.createElement('ul');
    ul.className = 'tree';
    node.children.forEach(ch=> ul.appendChild(buildNodeEl(ch,false)));
    li.appendChild(ul);
  }
  return li;
}

function renderTree(){
  canvas.innerHTML='';
  const rootUl = document.createElement('ul');
  rootUl.className = 'tree root';
  rootUl.appendChild(buildNodeEl(DATA, true));
  canvas.appendChild(rootUl);

  // Extra figures row
  const extraWrap = document.createElement('div');
  extraWrap.style.marginTop = '70px';
  extraWrap.style.display = 'flex';
  extraWrap.style.flexDirection = 'column';
  extraWrap.style.alignItems = 'center';
  extraWrap.style.gap = '10px';

  const h = document.createElement('div');
  h.id = 'extraHeading';
  h.style.fontSize = '12px';
  h.style.fontWeight = '700';
  h.style.color = 'var(--muted)';
  h.style.textTransform='uppercase';
  h.style.letterSpacing='.5px';
  h.textContent = lang==='tr' ? "Kur'an'da Geçen Diğer Şahsiyetler" : "Other Figures Mentioned in the Qur'an";
  extraWrap.appendChild(h);

  const row = document.createElement('div');
  row.style.display='flex'; row.style.gap='16px'; row.style.flexWrap='wrap'; row.style.justifyContent='center';
  EXTRA.forEach(node=>{
    const box = document.createElement('div');
    box.className = 'node';
    box.style.borderColor = '#4a9c8e';
    box.dataset.id = node.id;
    const nm = document.createElement('div'); nm.className='name'; nm.textContent = (lang==='tr'?node.tr[0]:node.en[0]);
    box.appendChild(nm);
    box.addEventListener('click', ()=> openModal({id:node.id, tr:{name:node.tr[0],title:node.tr[1],note:node.tr[2]}, en:{name:node.en[0],title:node.en[1],note:node.en[2]}, prophet:false}));
    row.appendChild(box);
  });
  extraWrap.appendChild(row);
  canvas.appendChild(extraWrap);

  applyTransform();
  drawConnectors();
}

/* Collapsing/expanding a branch changes the flex layout of the whole tree
   (widths shift as subtrees appear/disappear), but panX/panY don't know
   that — so without this, the node you just tapped can end up somewhere
   completely different on screen, reading as "the zoom got reset". This
   re-renders, then nudges pan by exactly the on-screen drift of `anchorId`
   so that node stays glued under your finger/cursor. */
function renderTreeKeepingAnchor(anchorId){
  const before = canvas.querySelector('.node[data-id="'+anchorId+'"]');
  const beforeRect = before ? before.getBoundingClientRect() : null;
  renderTree();
  if(!beforeRect) return;
  const after = canvas.querySelector('.node[data-id="'+anchorId+'"]');
  if(!after) return;
  const afterRect = after.getBoundingClientRect();
  panX += beforeRect.left - afterRect.left;
  panY += beforeRect.top - afterRect.top;
  applyTransform();
}

/* ============================================================
   CONNECTOR LINES (SVG overlay, computed from real box positions)
   ============================================================ */
const SVGNS = 'http://www.w3.org/2000/svg';
let linesSvg = null;

function localRect(el, canvasRect){
  const r = el.getBoundingClientRect();
  return {
    left: (r.left - canvasRect.left) / scale,
    top: (r.top - canvasRect.top) / scale,
    width: r.width / scale,
    height: r.height / scale
  };
}

function drawConnectors(){
  if(!linesSvg){
    linesSvg = document.createElementNS(SVGNS, 'svg');
    linesSvg.id = 'linesSvg';
    canvas.insertBefore(linesSvg, canvas.firstChild);
  } else if(linesSvg.parentNode !== canvas || canvas.firstChild !== linesSvg){
    canvas.insertBefore(linesSvg, canvas.firstChild);
  }
  linesSvg.innerHTML = '';
  linesSvg.setAttribute('width', canvas.offsetWidth);
  linesSvg.setAttribute('height', canvas.offsetHeight);

  const canvasRect = canvas.getBoundingClientRect();
  const lis = canvas.querySelectorAll('ul.tree li');

  lis.forEach(li=>{
    if(li.classList.contains('collapsed')) return;
    const parentBox = li.querySelector(':scope > .nodewrap > .node');
    const childUl = li.querySelector(':scope > ul.tree');
    if(!parentBox || !childUl) return;

    const pRect = localRect(parentBox, canvasRect);
    const pX = pRect.left + pRect.width/2;
    const pY = pRect.top + pRect.height;

    const childLis = Array.from(childUl.children).filter(c=>c.tagName==='LI');
    if(!childLis.length) return;
    const midY = pY + 17;

    childLis.forEach(childLi=>{
      const childBox = childLi.querySelector(':scope > .nodewrap > .node');
      if(!childBox) return;
      const cRect = localRect(childBox, canvasRect);
      const cX = cRect.left + cRect.width/2;
      const cY = cRect.top;
      const dashed = childLi.classList.contains('dashedlink');

      const path = document.createElementNS(SVGNS, 'path');
      const d = `M ${pX} ${pY} L ${pX} ${midY} L ${cX} ${midY} L ${cX} ${cY}`;
      path.setAttribute('d', d);
      path.setAttribute('class', 'connector' + (dashed ? ' dashed' : ''));
      linesSvg.appendChild(path);
    });
  });
}

/* ============================================================
   PAN / ZOOM
   ============================================================ */
const stage = document.getElementById('stage');

function applyTransform(){
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function centerInitial(){
  fitToScreen();
}

function fitToScreen(){
  requestAnimationFrame(()=>{
    const prevTransform = canvas.style.transform;
    canvas.style.transform = 'translate(0px,0px) scale(1)';
    const rect = canvas.getBoundingClientRect();
    const sRect = stage.getBoundingClientRect();
    const scaleX = sRect.width / rect.width;
    const scaleY = sRect.height / rect.height;
    scale = Math.max(0.06, Math.min(scaleX, scaleY, 1) * 0.95);
    panX = (sRect.width - rect.width * scale) / 2;
    panY = 16;
    applyTransform();
  });
}

/* Pointer capture is only engaged once real dragging is detected (movement
   past a small threshold). If we captured immediately on pointerdown, the
   browser retargets the resulting click to #stage instead of the node box
   under the cursor, silently breaking every node's click handler. */
const DRAG_THRESHOLD = 4;
let isPanning=false, isDragCandidate=false, activePointerId=null;
let startX=0, startY=0, startPanX=0, startPanY=0;
let isPinching=false; // true while a 2-finger touch gesture is active; suppresses single-pointer drag panning

stage.addEventListener('pointerdown', (e)=>{
  if(isPinching) return;
  isDragCandidate = true;
  isPanning = false;
  activePointerId = e.pointerId;
  startX=e.clientX; startY=e.clientY; startPanX=panX; startPanY=panY;
});
stage.addEventListener('pointermove', (e)=>{
  if(isPinching || !isDragCandidate) return;
  const dx = e.clientX-startX, dy = e.clientY-startY;
  if(!isPanning){
    if(Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
    isPanning = true;
    stage.classList.add('grabbing');
    try{ stage.setPointerCapture(activePointerId); }catch(err){}
  }
  e.preventDefault();
  panX = startPanX + dx;
  panY = startPanY + dy;
  applyTransform();
});
stage.addEventListener('dragstart', (e)=>{ e.preventDefault(); });
stage.addEventListener('selectstart', (e)=>{ e.preventDefault(); });
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  stage.addEventListener(ev, ()=>{ isDragCandidate=false; isPanning=false; stage.classList.remove('grabbing'); });
});

stage.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  zoomAt(mx, my, delta);
}, {passive:false});

function zoomAt(mx, my, factor){
  const newScale = Math.min(2.2, Math.max(0.12, scale*factor));
  const ratio = newScale/scale;
  panX = mx - (mx-panX)*ratio;
  panY = my - (my-panY)*ratio;
  scale = newScale;
  applyTransform();
}

document.getElementById('zoomIn').addEventListener('click', ()=>{
  const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.2);
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.83);
});
document.getElementById('zoomReset').addEventListener('click', ()=>{
  fitToScreen();
});

/* iOS Safari ignores the viewport meta's user-scalable=no/maximum-scale=1
   (dropped for accessibility since iOS 10) and still performs its own native
   whole-page pinch-zoom via WebKit-only 'gesture*' events — independent of
   touch-action and independent of our own touch-based pinch handler below.
   Left unblocked, BOTH zoom systems fire from the same pinch, compounding
   into exactly the "content drifts off to one side" symptom. Gesture events
   are non-standard (no preventDefault effect outside WebKit) so this is a
   safe no-op on other browsers. */
['gesturestart','gesturechange','gestureend'].forEach(ev=>{
  document.addEventListener(ev, (e)=>{ e.preventDefault(); }, {passive:false});
});

// pinch zoom (two-touch) — zooms around the midpoint between the two fingers,
// exactly like the desktop wheel-zoom, so content stays under the fingers
// instead of growing off toward one corner.
let pinchLastDist=null;
stage.addEventListener('touchstart', (e)=>{
  if(e.touches.length===2){
    isPinching = true;
    isDragCandidate = false;
    isPanning = false;
    stage.classList.remove('grabbing');
    pinchLastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
}, {passive:true});
stage.addEventListener('touchmove', (e)=>{
  if(e.touches.length===2 && pinchLastDist){
    e.preventDefault();
    const t0=e.touches[0], t1=e.touches[1];
    const dist = Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY);
    const factor = dist/pinchLastDist;
    const rect = stage.getBoundingClientRect();
    const midX = (t0.clientX+t1.clientX)/2 - rect.left;
    const midY = (t0.clientY+t1.clientY)/2 - rect.top;
    zoomAt(midX, midY, factor);
    pinchLastDist = dist;
  }
}, {passive:false});
stage.addEventListener('touchend', (e)=>{
  if(e.touches.length<2){ pinchLastDist=null; isPinching=false; }
});
stage.addEventListener('touchcancel', ()=>{ pinchLastDist=null; isPinching=false; });

/* ============================================================
   SEARCH
   ============================================================ */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

function allNodesFlat(){
  const list = [];
  (function walk(nd){ list.push(nd); (nd.children||[]).forEach(walk); })(DATA);
  EXTRA.forEach(e=>list.push({id:e.id, tr:{name:e.tr[0],title:e.tr[1]}, en:{name:e.en[0],title:e.en[1]}}));
  return list;
}
const FLAT = allNodesFlat();

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLocaleLowerCase('tr');
  searchResults.innerHTML='';
  if(!q){ searchResults.style.display='none'; return; }
  const matches = FLAT.filter(n=>{
    const nm = ((lang==='tr'?n.tr.name:n.en.name)||'').toLocaleLowerCase('tr');
    const nm2 = (n.tr.name||'').toLocaleLowerCase('tr');
    const nm3 = (n.en.name||'').toLocaleLowerCase('tr');
    return nm.includes(q) || nm2.includes(q) || nm3.includes(q);
  }).slice(0,20);
  if(!matches.length){
    const d = document.createElement('div'); d.className='none';
    d.textContent = lang==='tr' ? 'Sonuç bulunamadı' : 'No results';
    searchResults.appendChild(d);
  } else {
    matches.forEach(m=>{
      const d = document.createElement('div');
      d.textContent = (lang==='tr'?m.tr.name:m.en.name) + (m.tr.title? ' — '+(lang==='tr'?m.tr.title:m.en.title):'');
      d.addEventListener('click', ()=>{ jumpTo(m.id); searchResults.style.display='none'; searchInput.value=''; });
      searchResults.appendChild(d);
    });
  }
  searchResults.style.display='block';
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.searchbox')) searchResults.style.display='none';
});

function ensureVisible(id){
  // expand all ancestor collapsed nodes
  function findPath(node, path){
    path = path.concat([node.id]);
    if(node.id===id) return path;
    for(const ch of (node.children||[])){
      const r = findPath(ch, path);
      if(r) return r;
    }
    return null;
  }
  const path = findPath(DATA, []);
  if(path){ path.forEach(pid=> collapsedIds.delete(pid)); }
}

function jumpTo(id){
  ensureVisible(id);
  renderTree();
  requestAnimationFrame(()=>{
    const el = canvas.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
    if(!el) return;
    const stageRect = stage.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    // convert current el position back to canvas coords accounting for transform
    const canvasRect = canvas.getBoundingClientRect();
    const cx = (elRect.left - canvasRect.left)/scale;
    const cy = (elRect.top - canvasRect.top)/scale;
    panX = stageRect.width/2 - cx*scale - (elRect.width/2);
    panY = stageRect.height/2 - cy*scale - (elRect.height/2);
    applyTransform();
    el.classList.add('highlight');
    setTimeout(()=> el.classList.remove('highlight'), 2800);
  });
}

/* ============================================================
   MODAL
   ============================================================ */
const overlay = document.getElementById('overlay');
function openModal(node){
  const d = node[lang] || node.tr;
  document.getElementById('modalName').textContent = d.name;
  document.getElementById('modalTitleTxt').textContent = d.title || '';
  const body = document.getElementById('modalBody');
  body.innerHTML='';
  if(node.prophet){
    const b = document.createElement('span'); b.className='badge';
    b.textContent = lang==='tr' ? "Kur'an'da adı geçen peygamber" : 'Prophet named in the Qur\'an';
    body.appendChild(b);
    body.appendChild(document.createElement('br'));
  }
  const p = document.createElement('div');
  p.textContent = d.note || (lang==='tr' ? 'Bu kişi hakkında ek not bulunmuyor.' : 'No additional note available.');
  body.appendChild(p);
  overlay.style.display='flex';
}
document.getElementById('modalClose').addEventListener('click', ()=> overlay.style.display='none');
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.style.display='none'; });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') overlay.style.display='none'; });

/* ============================================================
   EXPAND / COLLAPSE ALL
   ============================================================ */
document.getElementById('expandAllBtn').addEventListener('click', ()=>{
  collapsedIds.clear(); renderTree(); fitToScreen();
});
document.getElementById('collapseAllBtn').addEventListener('click', ()=>{
  (function walk(nd){ if(nd.children && nd.children.length){ collapsedIds.add(nd.id); nd.children.forEach(walk); } })(DATA);
  renderTree(); fitToScreen();
});

/* ============================================================
   LANGUAGE
   ============================================================ */
const I18N = {
  tr:{ title:'Şecere-i Muhammedî', sub:'Peygamberler Soy Ağacı — İnteraktif',
       search:'İsim ara…', expand:'Tümünü Aç', collapse:'Tümünü Kapat',
       legendTitle:'Gösterge', lg1:"Peygamber (Kur'an'da adı geçen)", lg2:'Ata / Aile üyesi',
       lg3:'Doğrudan soy', lg4:'Nesil atlama / dolaylı bağ', hide:'Gizle',
       hint:'🖱️ Sürükle • Tekerlek: yakınlaştır • Kutuya tıkla: detay • ⊕/⊖: dalları aç/kapat' },
  en:{ title:'Genealogy of Muhammad ﷺ', sub:'Family Tree of the Prophets — Interactive',
       search:'Search names…', expand:'Expand All', collapse:'Collapse All',
       legendTitle:'Legend', lg1:'Prophet (named in the Qur\'an)', lg2:'Ancestor / family member',
       lg3:'Direct descent', lg4:'Skip-generation / indirect link', hide:'Hide',
       hint:'🖱️ Drag • Wheel: zoom • Click a box: details • ⊕/⊖: expand/collapse branch' }
};

function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.getElementById('mainTitle').firstChild.textContent = t.title + ' ';
  document.getElementById('subTitle').textContent = t.sub;
  searchInput.placeholder = t.search;
  document.querySelector('#expandAllBtn span').textContent = t.expand;
  document.querySelector('#collapseAllBtn span').textContent = t.collapse;
  document.getElementById('legendTitle').textContent = t.legendTitle;
  document.getElementById('lg1').textContent = t.lg1;
  document.getElementById('lg2').textContent = t.lg2;
  document.getElementById('lg3').textContent = t.lg3;
  document.getElementById('lg4').textContent = t.lg4;
  document.getElementById('legendHide').textContent = t.hide;
  document.getElementById('hint').textContent = t.hint;
  renderTree();
}

document.getElementById('langSel').addEventListener('change', (e)=>{
  lang = e.target.value; applyLang();
});

/* ============================================================
   THEME
   ============================================================ */
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effectiveDark = current ? current==='dark' : sysDark;
  root.setAttribute('data-theme', effectiveDark ? 'light' : 'dark');
});

/* legend hide */
document.getElementById('legendHide').addEventListener('click', ()=>{
  document.getElementById('legend').style.display='none';
});

/* hint auto-fade */
setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.opacity='0'; }, 6000);

/* ============================================================
   INIT
   ============================================================ */
renderTree();
centerInitial();
</script>
